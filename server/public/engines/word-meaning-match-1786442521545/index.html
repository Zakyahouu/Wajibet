<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Word Match</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/sdk/wajibet-sdk.js"></script>
</head>

<body>
  <div class="app">
    <header class="hud hidden" id="hud">
      <div class="hud-row">
        <span class="hud-progress" id="progress" aria-live="polite">–</span>
        <span class="hud-score" id="scoreDisplay" aria-live="polite">Score 0</span>
      </div>
      <div class="timer-track hidden" id="timerTrack">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </header>

    <main class="stage">
      <section class="card center-card" id="startScreen">
        <p class="eyebrow">Vocabulary</p>
        <h1 class="game-title" id="gameTitle">Word Match</h1>
        <p class="lede" id="lede"></p>
        <button type="button" class="btn" id="startBtn">Start</button>
      </section>

      <!-- The 'full-bleed' class allows the layout to hit the edges on mobile -->
      <section class="card hidden full-bleed" id="playScreen">
        <div class="game-layout">

          <!-- Left Side: Definitions (The Locks) -->
          <div class="definitions-area">
            <p class="prompt" id="prompt">Match the words to their meanings</p>
            <div id="slotsContainer" class="slots-container"></div>

            <div class="feedback hidden" id="feedback">
              <p class="feedback-headline" id="feedbackHeadline"></p>
              <p class="feedback-detail" id="feedbackDetail"></p>
            </div>

            <div class="actions center-actions">
              <button type="button" class="btn" id="confirmBtn" disabled>Confirm Matches</button>
              <button type="button" class="btn hidden" id="nextBtn">Next Round</button>
            </div>
          </div>

          <!-- Right Side (Desktop) / Bottom Sticky Dock (Mobile): Word Bank (The Keys) -->
          <div class="word-bank-area">
            <div class="word-bank-header">
              <p class="sq-label">Word Bank (Tap or Drag)</p>
            </div>
            <div id="wordBank" class="word-bank"></div>
          </div>

        </div>
      </section>

      <section class="card center-card hidden" id="endScreen">
        <p class="eyebrow">Finished</p>
        <h1 class="end-score" id="endScore"></h1>
        <p class="end-stats" id="endStats"></p>
      </section>

      <section class="card center-card hidden" id="emptyScreen">
        <p class="eyebrow">Nothing to play yet</p>
        <p class="lede">This game has no content configured.</p>
      </section>
    </main>
  </div>
  <script src="core.js"></script>
  <script src="game.js"></script>
</body>

</html>
