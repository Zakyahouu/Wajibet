<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map Pin Geography — Review</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Small review-only additions; everything else reuses the game's design system. */
  body { background: var(--paper); }
  .review-card { max-width: 640px; margin: 1rem auto; }
  .review-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.15rem 0; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
  .review-row strong { color: var(--ink-text); font-weight: 600; }
</style>
</head>
<body>
  <section class="card review-card" id="card">
    <p class="eyebrow" id="statusEyebrow">Reviewing</p>
    <p class="prompt" id="locationLabel" style="margin-inline-start:0;"></p>

    <div class="map-frame" id="mapFrame">
      <img id="mapImage" class="map-image" alt="" draggable="false" />
      <div class="marker marker--target" id="markerTarget" hidden></div>
      <div class="marker marker--click" id="markerClick" hidden></div>
    </div>

    <div class="feedback" style="border-top:none; margin-top:1rem; padding-top:0;">
      <div class="review-row"><span>Result</span><strong id="resultText"></strong></div>
      <div class="review-row"><span>Points earned</span><strong id="pointsText"></strong></div>
      <div class="review-row"><span>Distance from target</span><strong id="distanceText"></strong></div>
      <div class="review-row"><span>Time spent</span><strong id="timeText"></strong></div>
    </div>
  </section>

  <script src="/sdk/wajibet-sdk.js"></script>
  <script>
    WajibetSDK.onReviewData(function (interaction) {
      document.documentElement.dir = WajibetSDK.getDirection();

      var meta = interaction.meta || {};
      var img = document.getElementById('mapImage');
      img.src = meta.mapImage || '';
      img.alt = meta.locationLabel ? ('Map for: ' + meta.locationLabel) : 'Map';

      document.getElementById('locationLabel').textContent = meta.locationLabel || interaction.correctAnswer || '';

      var eyebrow = document.getElementById('statusEyebrow');
      var resultText = document.getElementById('resultText');
      if (interaction.skipped) {
        eyebrow.textContent = 'Not answered in time';
        resultText.textContent = 'Timed out';
      } else if (interaction.isCorrect) {
        eyebrow.textContent = 'Correct';
        resultText.textContent = 'Correct';
      } else if ((interaction.score || 0) > 0) {
        eyebrow.textContent = 'Near miss';
        resultText.textContent = 'Close, not exact';
      } else {
        eyebrow.textContent = 'Incorrect';
        resultText.textContent = 'Incorrect';
      }

      document.getElementById('pointsText').textContent =
        (interaction.score || 0) + ' / ' + (interaction.maxScore || 0);
      document.getElementById('distanceText').textContent =
        (typeof meta.distancePercent === 'number') ? (meta.distancePercent + '%') : '—';
      document.getElementById('timeText').textContent =
        (((interaction.timeMs || 0) / 1000).toFixed(1)) + 's';

      // Coordinates are stored as a percentage OF THE IMAGE ITSELF (see game.js),
      // so placing a marker means redoing the same object-fit: contain rect
      // math the game uses — a raw CSS percentage would only be correct if
      // the image exactly filled the frame with no letterboxing.
      function getRenderedRect(frameEl, imgEl) {
        var frameRect = frameEl.getBoundingClientRect();
        var naturalW = imgEl.naturalWidth || 1;
        var naturalH = imgEl.naturalHeight || 1;
        var containerW = frameRect.width;
        var containerH = frameRect.height;
        var containerRatio = containerW / containerH;
        var naturalRatio = naturalW / naturalH;
        var renderW, renderH, offsetX, offsetY;
        if (naturalRatio > containerRatio) {
          renderW = containerW; renderH = containerW / naturalRatio;
          offsetX = 0; offsetY = (containerH - renderH) / 2;
        } else {
          renderH = containerH; renderW = containerH * naturalRatio;
          offsetY = 0; offsetX = (containerW - renderW) / 2;
        }
        return { renderW: renderW, renderH: renderH, offsetX: offsetX, offsetY: offsetY };
      }

      function placeMarker(el, xPercent, yPercent) {
        var rect = getRenderedRect(document.getElementById('mapFrame'), img);
        el.style.left = (rect.offsetX + (xPercent / 100) * rect.renderW) + 'px';
        el.style.top = (rect.offsetY + (yPercent / 100) * rect.renderH) + 'px';
        el.hidden = false;
      }

      // Place markers once the map image has actual dimensions to work with,
      // and again on resize since the rendered rect changes with frame size.
      function placeMarkers() {
        var targetX = meta.targetXPercent, targetY = meta.targetYPercent;
        var clickX = meta.clickXPercent, clickY = meta.clickYPercent;
        var targetEl = document.getElementById('markerTarget');
        var clickEl = document.getElementById('markerClick');

        if (typeof targetX === 'number' && typeof targetY === 'number') {
          placeMarker(targetEl, targetX, targetY);
        }
        if (typeof clickX === 'number' && typeof clickY === 'number') {
          clickEl.classList.toggle('is-correct', !!interaction.isCorrect);
          placeMarker(clickEl, clickX, clickY);
        }
      }

      if (img.complete) { placeMarkers(); } else { img.addEventListener('load', placeMarkers); }
      window.addEventListener('resize', placeMarkers);
    });
  </script>
</body>
</html>
