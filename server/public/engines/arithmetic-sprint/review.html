<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #fd79a8 100%);
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    }
    #review-card {
      background: rgba(255,255,255,0.97);
      color: #2d3436;
      padding: 28px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .badge.correct  { background: rgba(0,212,170,0.12); color: #00b894; }
    .badge.wrong    { background: rgba(255,71,87,0.10);  color: #ff4757; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b2bec3;
      margin-bottom: 6px;
    }

    .equation {
      font-size: 34px;
      font-weight: 900;
      color: #ff6b35;
      text-align: center;
      margin-bottom: 20px;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .answer-box {
      padding: 14px;
      border-radius: 12px;
      border: 2px solid;
      text-align: center;
    }
    .answer-box .ab-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .answer-box .ab-value {
      font-size: 24px;
      font-weight: 900;
    }
    .answer-box.correct { border-color: #00b894; background: rgba(0,212,170,0.08); }
    .answer-box.correct .ab-label { color: #00b894; }
    .answer-box.correct .ab-value { color: #00b894; }
    .answer-box.wrong   { border-color: #ff4757; background: rgba(255,71,87,0.07); }
    .answer-box.wrong   .ab-label { color: #ff4757; }
    .answer-box.wrong   .ab-value { color: #ff4757; }

    .penalty-notice {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #856404;
      margin-bottom: 14px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #636e72;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #f0f0f0;
    }
    .meta-row strong { color: #2d3436; }
  </style>
</head>
<body>
  <div id="review-card">
    <p style="color:#888; font-size:0.9em; text-align:center;">Loading review…</p>
  </div>
  <script>
    WajibetSDK.onReviewData(function (interaction) {
      document.documentElement.dir = WajibetSDK.getDirection();
      var card = document.getElementById('review-card');
      var meta = interaction.meta || {};

      var question      = meta.question      || '';
      var isCorrect     = interaction.isCorrect;
      var timeMs        = interaction.timeMs  || 0;
      var timeSec       = (timeMs / 1000).toFixed(1);

      // Use meta fields for actual numbers, fall back to string fields
      var studentAnswer = meta.selectedAnswer !== undefined ? meta.selectedAnswer : interaction.userAnswer;
      var correctAnswer = meta.correctAnswer  !== undefined ? meta.correctAnswer  : interaction.correctAnswer;
      var penaltyAmt    = meta.penaltyApplied || 0;

      // --- Status badge ---
      var badgeClass = isCorrect ? 'correct' : 'wrong';
      var badgeText  = isCorrect ? ('✓ ' + WajibetSDK.t('correct')) : ('✗ ' + WajibetSDK.t('wrong'));

      // --- Answer grid ---
      var answerGridHtml = '';
      if (isCorrect) {
        // Only show one box — student was right
        answerGridHtml =
          '<div class="answer-grid" style="grid-template-columns: 1fr;">' +
            '<div class="answer-box correct">' +
              '<div class="ab-label">✓ ' + WajibetSDK.t('yourAnswer') + '</div>' +
              '<div class="ab-value">' + escHtml(String(studentAnswer)) + '</div>' +
            '</div>' +
          '</div>';
      } else {
        answerGridHtml =
          '<div class="answer-grid">' +
            '<div class="answer-box wrong">' +
              '<div class="ab-label">✗ ' + WajibetSDK.t('yourAnswer') + '</div>' +
              '<div class="ab-value">' + escHtml(String(studentAnswer !== null && studentAnswer !== undefined ? studentAnswer : '—')) + '</div>' +
            '</div>' +
            '<div class="answer-box correct">' +
              '<div class="ab-label">✓ ' + WajibetSDK.t('correctAnswer') + '</div>' +
              '<div class="ab-value">' + escHtml(String(correctAnswer)) + '</div>' +
            '</div>' +
          '</div>';
      }

      // --- Penalty notice ---
      var penaltyHtml = '';
      if (!isCorrect && penaltyAmt > 0) {
        penaltyHtml = '<div class="penalty-notice">⚠️ Penalty applied: <strong>−' + penaltyAmt + ' point' + (penaltyAmt !== 1 ? 's' : '') + '</strong></div>';
      }

      card.innerHTML =
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
        '<p class="section-label">' + WajibetSDK.t('question') + '</p>' +
        '<p class="equation"><span dir="ltr">' + escHtml(question) + '</span></p>' +
        answerGridHtml +
        penaltyHtml +
        '<div class="meta-row">' +
          '<span>' + WajibetSDK.t('time') + ': <strong>' + timeSec + 's</strong></span>' +
          '<span>' + WajibetSDK.t('score') + ': <strong>' + (interaction.score || 0) + ' / ' + (interaction.maxScore || 0) + '</strong></span>' +
        '</div>';
    });

    function escHtml(str) {
      var d = document.createElement('div');
      d.textContent = String(str == null ? '' : str);
      return d.innerHTML;
    }
  </script>
</body>
</html>
