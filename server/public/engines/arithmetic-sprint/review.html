<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arithmetic Review</title>
  <link rel="stylesheet" href="style.css">
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0;
      background: transparent;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .review-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .question-text {
      font-size: 2.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 24px;
    }
    .result-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      margin-top: 16px;
    }
    .result-badge.correct { background: #dcfce7; color: #166534; }
    .result-badge.wrong { background: #fee2e2; color: #991b1b; }
    .answer-details {
      margin-top: 16px;
      font-size: 1.1rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="review-container">
    <div id="question" class="question-text"></div>
    <div id="badge" class="result-badge"></div>
    <div id="details" class="answer-details"></div>
  </div>

  <script>
    WajibetSDK.onReviewData((payload) => {
      const meta = payload.meta || {};
      // Reconstruct question string from payload if needed
      const question = payload.question || (payload.item && payload.item.question) || 'Unknown question';
      
      document.getElementById('question').textContent = question;
      
      const badge = document.getElementById('badge');
      const details = document.getElementById('details');
      
      const isCorrect = payload.isCorrect === true;
      const userAnswer = payload.userAnswer;
      const correctAnswer = payload.correctAnswer;
      
      if (isCorrect) {
        badge.textContent = 'Correct!';
        badge.className = 'result-badge correct';
        details.innerHTML = `Answer: <strong>${userAnswer}</strong>`;
      } else {
        badge.textContent = 'Incorrect';
        badge.className = 'result-badge wrong';
        details.innerHTML = `Selected: <strong>${userAnswer}</strong><br>Correct: <strong>${correctAnswer}</strong>`;
      }
      
      if (meta.speedBonusApplied) {
        details.innerHTML += `<br><span style="color:#f59e0b; font-weight:bold;">⚡ Speed Bonus Applied</span>`;
      }
    });
  </script>
</body>
</html>
