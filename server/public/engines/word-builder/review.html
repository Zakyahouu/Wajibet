<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #5B3DAC;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 24px 16px;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    }
    #review-card {
      background: rgba(255,255,255,0.97);
      color: #130A3E;
      padding: 28px;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .badge.correct  { background: #e8f5e9; color: #2e7d32; }
    .badge.wrong    { background: #ffebee; color: #c62828; }
    .badge.timeout  { background: #fff3e0; color: #e65100; }

    /* Word display */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7B68EE;
      margin-bottom: 6px;
    }
    .word-display {
      font-size: 26px;
      letter-spacing: 6px;
      font-weight: 800;
      margin-bottom: 18px;
      padding: 10px 0;
    }
    .word-correct { color: #2e7d32; }
    .word-wrong   { color: #c62828; }
    .word-muted   { color: #888; font-style: italic; font-size: 18px; letter-spacing: 2px; }

    /* Letters diff — show matching letters green, mismatches red */
    .diff-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .diff-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      border: 2px solid;
    }
    .diff-letter.ok    { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }
    .diff-letter.bad   { background: #ffebee; border-color: #c62828; color: #c62828; }
    .diff-letter.extra { background: #fafafa; border-color: #ccc; color: #aaa; }

    /* Hint box */
    .hint-box {
      background: #f3f0ff;
      border: 1px solid #c4b5fd;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #5b3dac;
      margin-bottom: 16px;
    }
    .hint-box strong { display: block; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }

    /* Timeout notice */
    .timeout-notice {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e65100;
      margin-bottom: 16px;
    }

    /* Meta row */
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e0d9f5;
    }
    .meta-row strong { color: #130A3E; }
  </style>
</head>
<body>
  <div id="review-card">
    <p style="color:#888; font-size:0.9em; text-align:center;">Loading review…</p>
  </div>
  <script>
    WajibetSDK.onReviewData(function (interaction) {
      document.documentElement.dir = WajibetSDK.getDirection();
      var card = document.getElementById('review-card');
      var meta = interaction.meta || {};

      var targetWord  = (meta.targetWord  || interaction.correctAnswer || '').toUpperCase();
      var builtWord   = (meta.builtWord   || interaction.userAnswer    || '').toUpperCase();
      var isCorrect   = interaction.isCorrect;
      var isTimedOut  = !!meta.timedOut || !!interaction.skipped;
      var attempts    = interaction.attempts || 1;
      var timeMs      = interaction.timeMs || 0;
      var timeSec     = (timeMs / 1000).toFixed(1);
      var hint        = meta.hint || null;
      var hintVisible = !!meta.hintVisible;

      // --- Status badge ---
      var badgeClass = isCorrect ? 'correct' : isTimedOut ? 'timeout' : 'wrong';
      var badgeText  = isCorrect ? ('✓ ' + WajibetSDK.t('correct')) : isTimedOut ? ('⏱ ' + WajibetSDK.t('timesUp')) : ('✗ ' + WajibetSDK.t('wrong'));

      // --- Letter diff (only when wrong/timed-out, both non-empty) ---
      var diffHtml = '';
      if (!isCorrect && targetWord && builtWord) {
        diffHtml = '<p class="section-label">' + WajibetSDK.t('letterComparison') + '</p><div class="diff-row">';
        var maxLen = Math.max(targetWord.length, builtWord.length);
        for (var i = 0; i < maxLen; i++) {
          var tLetter = targetWord[i] || '';
          var bLetter = builtWord[i]  || '';
          if (!tLetter) {
            // extra letters the student typed that shouldn't be there
            diffHtml += '<div class="diff-letter extra">' + escHtml(bLetter) + '</div>';
          } else if (bLetter === tLetter) {
            diffHtml += '<div class="diff-letter ok">' + escHtml(tLetter) + '</div>';
          } else {
            diffHtml += '<div class="diff-letter bad">' + escHtml(bLetter || '?') + '</div>';
          }
        }
        diffHtml += '</div>';
      }

      // --- Timeout notice ---
      var timeoutHtml = '';
      if (isTimedOut && !isCorrect) {
        timeoutHtml = '<div class="timeout-notice">⏱ ' + WajibetSDK.t('timesUp') + '</div>';
      }

      // --- Hint box ---
      var hintHtml = '';
      if (hintVisible && hint) {
        hintHtml = '<div class="hint-box"><strong>' + WajibetSDK.t('hint') + '</strong>' + escHtml(hint) + '</div>';
      }

      card.innerHTML =
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +

        '<p class="section-label">' + WajibetSDK.t('correctWord') + '</p>' +
        '<p class="word-display word-correct">' + escHtml(targetWord) + '</p>' +

        '<p class="section-label">' + WajibetSDK.t('yourAnswer') + '</p>' +
        (builtWord
          ? '<p class="word-display ' + (isCorrect ? 'word-correct' : 'word-wrong') + '">' + escHtml(builtWord) + '</p>'
          : '<p class="word-display word-muted">(—)</p>') +

        diffHtml +
        timeoutHtml +
        hintHtml +

        '<div class="meta-row">' +
          '<span>' + WajibetSDK.t('attempts') + ': <strong>' + attempts + '</strong></span>' +
          '<span>' + WajibetSDK.t('time') + ': <strong>' + timeSec + 's</strong></span>' +
          '<span>' + WajibetSDK.t('score') + ': <strong>' + (interaction.score || 0) + '/' + (interaction.maxScore || 0) + '</strong></span>' +
        '</div>';
    });

    function escHtml(str) {
      var d = document.createElement('div');
      d.textContent = String(str == null ? '' : str);
      return d.innerHTML;
    }
  </script>
</body>
</html>
