<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    body { background: #5B3DAC; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #review-card {
      background: rgba(255, 255, 255, 0.95); color: #130A3E; padding: 30px; border-radius: 16px;
      max-width: 400px; width: 90%; text-align: center;
    }
    .review-label { font-size: 0.8em; color: #666; margin-top: 12px; margin-bottom: 4px; }
    .review-word { font-size: 1.6em; letter-spacing: 3px; margin: 4px 0; }
    .review-correct { color: #2e7d32; }
    .review-wrong { color: #c62828; }
    .review-meta { font-size: 0.85em; color: #555; margin-top: 14px; }
    .review-badge {
      display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.9em; margin-top: 10px;
    }
    .review-badge.correct { background: #e8f5e9; color: #2e7d32; }
    .review-badge.wrong { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div id="review-card">
    <p style="color: #888; font-size: 0.9em;">Loading review…</p>
  </div>
  <script>
    WajibetSDK.onReviewData(function (interaction) {
      document.documentElement.dir = WajibetSDK.getDirection();
      var card = document.getElementById('review-card');
      var meta = interaction.meta || {};

      var targetWord = (meta.targetWord || interaction.correctAnswer || '').toUpperCase();
      var builtWord = (meta.builtWord || interaction.userAnswer || '').toUpperCase();
      var isCorrect = interaction.isCorrect;
      var attempts = interaction.attempts || 1;
      var timeMs = interaction.timeMs || 0;
      var timeSec = (timeMs / 1000).toFixed(1);

      card.innerHTML =
        '<p class="review-label">Target Word</p>' +
        '<p class="review-word">' + escapeHtml(targetWord) + '</p>' +
        '<p class="review-label">Student\'s Answer</p>' +
        '<p class="review-word ' + (isCorrect ? 'review-correct' : 'review-wrong') + '">' +
          escapeHtml(builtWord || '(no answer)') + '</p>' +
        '<span class="review-badge ' + (isCorrect ? 'correct' : 'wrong') + '">' +
          (isCorrect ? '✓ Correct' : '✗ Wrong') + '</span>' +
        '<p class="review-meta">' +
          'Attempts: ' + attempts + ' · Time: ' + timeSec + 's · ' +
          'Score: ' + interaction.score + '/' + interaction.maxScore +
        '</p>';
    });

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
