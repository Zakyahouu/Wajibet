<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline Sequencer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/sdk/wajibet-sdk.js"></script>
</head>

<body>
  <div class="app">

    <header class="hud hidden" id="hud">
      <div class="hud-row">
        <span class="hud-progress" id="progress" aria-live="polite">–</span>
        <span class="hud-score" id="scoreDisplay" aria-live="polite">Score 0</span>
      </div>
      <div class="timer-track hidden" id="timerTrack">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </header>

    <main class="stage">

      <section class="card center-card" id="startScreen">
        <p class="eyebrow">Chronology</p>
        <h1 class="game-title" id="gameTitle">Timeline Sequencer</h1>
        <p class="lede" id="lede"></p>
        <button type="button" class="btn" id="startBtn">Start</button>
      </section>

      <section class="card hidden" id="playScreen">
        <!-- The Era Title -->
        <p class="prompt" id="prompt"></p>

        <div id="questionArea">
          <!-- The Deck of unsorted cards -->
          <p class="sq-label">Events (Tap or Drag to place):</p>
          <div id="deckArea" class="deck-area"></div>

          <!-- The Vertical Subway Timeline -->
          <p class="sq-label" style="margin-top: 2.5rem;">The Timeline:</p>
          <div id="pathArea" class="path-area">
            <!-- Nodes injected by JS -->
          </div>

          <div class="central-action-dock">
            <button type="button" id="masterLockBtn" class="master-lock-btn">✓ Confirm Timeline</button>
          </div>
        </div>

        <div class="feedback hidden" id="feedback">
          <p class="feedback-headline" id="feedbackHeadline"></p>
          <p class="feedback-detail" id="feedbackDetail"></p>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="confirmBtn" style="display:none;" disabled>Confirm answer</button>
          <button type="button" class="btn hidden" id="nextBtn">Next Timeline</button>
        </div>
      </section>

      <section class="card center-card hidden" id="endScreen">
        <p class="eyebrow">Finished</p>
        <h1 class="end-score" id="endScore"></h1>
        <p class="end-stats" id="endStats"></p>
      </section>

      <section class="card center-card hidden" id="emptyScreen">
        <p class="eyebrow">Nothing to play yet</p>
        <p class="lede">This game has no content configured.</p>
      </section>

    </main>
  </div>
  <script src="core.js"></script>
  <script src="game.js"></script>
</body>

</html>
