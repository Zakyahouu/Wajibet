<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reference Quiz — Review</title>
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    :root {
      --ok: #16a34a; --bad: #dc2626; --accent: #4f46e5;
      --line: #e2e8f0; --ink: #0f172a; --muted: #64748b;
      --bg-ok: #f0fdf4; --bg-bad: #fef2f2; --bg-sel: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      min-height: 100vh;
      display: grid;
      place-items: start center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(2,6,23,0.25);
      margin-top: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .status-badge.correct { background: var(--bg-ok); color: var(--ok); }
    .status-badge.wrong   { background: var(--bg-bad); color: var(--bad); }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .options-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #f8fafc;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .option-row.is-correct { border-color: var(--ok); background: var(--bg-ok); font-weight: 700; }
    .option-row.is-wrong   { border-color: var(--bad); background: var(--bg-bad); }

    .option-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--line);
      color: var(--muted);
    }
    .option-row.is-correct .option-key { background: var(--ok); color: #fff; }
    .option-row.is-wrong   .option-key { background: var(--bad); color: #fff; }

    .option-badge {
      margin-left: auto;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .option-row.is-correct .option-badge { color: var(--ok); }
    .option-row.is-wrong   .option-badge { color: var(--bad); }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .meta-row strong { color: var(--ink); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p style="color: var(--muted);">Loading review…</p>
  </div>

  <script>
    (function () {
      if (typeof WajibetSDK === 'undefined') {
        document.getElementById('card').textContent = 'SDK missing.';
        return;
      }

      WajibetSDK.onReviewData(function (a) {
        document.documentElement.dir = WajibetSDK.getDirection();
        var card = document.getElementById('card');

        if (!a) { card.textContent = 'No review data.'; return; }

        var m = a.meta || {};
        var isCorrect = !!a.isCorrect;
        var isSkipped = !!a.skipped;

        // --- Status badge ---
        var statusText = isSkipped ? '⏱ Timed out' : isCorrect ? '✓ Correct' : '✗ Incorrect';
        var statusClass = isCorrect ? 'correct' : 'wrong';

        // --- Build option rows ---
        var optionsList = Array.isArray(m.options) ? m.options : [];
        var correctKey = m.correctKey || '';
        var selectedKey = m.selectedKey || '';
        var optionsHtml = '';

        if (optionsList.length > 0) {
          optionsHtml = '<p class="options-label">Answer choices</p>';
          for (var i = 0; i < optionsList.length; i++) {
            var opt = optionsList[i];
            var isThisCorrect = opt.key === correctKey;
            var isThisWrong   = opt.key === selectedKey && !isCorrect;
            var rowClass = isThisCorrect ? 'is-correct' : isThisWrong ? 'is-wrong' : '';
            var badge = isThisCorrect ? '✓ Correct answer'
                      : isThisWrong   ? '✗ Student chose this'
                      : '';
            optionsHtml +=
              '<div class="option-row ' + rowClass + '">' +
                '<span class="option-key">' + escHtml(opt.key) + '</span>' +
                '<span>' + escHtml(opt.label) + '</span>' +
                (badge ? '<span class="option-badge">' + badge + '</span>' : '') +
              '</div>';
          }
        } else {
          // Fallback when no full options list stored (older data)
          optionsHtml =
            '<p class="options-label">Correct answer</p>' +
            '<div class="option-row is-correct"><span>' + escHtml(a.correctAnswer || '') + '</span></div>';
          if (!isCorrect) {
            optionsHtml +=
              '<p class="options-label">Student\'s answer</p>' +
              '<div class="option-row is-wrong"><span>' + escHtml(a.userAnswer || '(none)') + '</span></div>';
          }
        }

        var secs = (Number(a.timeMs) / 1000).toFixed(1);

        card.innerHTML =
          '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
          (m.question
            ? '<div class="question-text">' + escHtml(m.question) + '</div>'
            : '') +
          optionsHtml +
          '<div class="meta-row">' +
            '<span>Time: <strong>' + secs + 's</strong></span>' +
            '<span>Score: <strong>' + (a.score || 0) + ' / ' + (a.maxScore || 0) + ' pts</strong></span>' +
          '</div>';
      });

      function escHtml(str) {
        var d = document.createElement('div');
        d.textContent = String(str == null ? '' : str);
        return d.innerHTML;
      }
    })();
  </script>
</body>
</html>
