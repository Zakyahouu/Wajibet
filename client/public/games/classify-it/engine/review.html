<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="stage">
    <section class="card" style="padding: 1.5rem;">
      <p class="eyebrow" id="status"></p>

      <div class="sorter-area">
        <div id="dropZones" class="drop-zones"></div>
      </div>

      <p class="feedback-detail" id="why" style="text-align: center; margin-top: 1rem;"></p>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--edge);">
        <div class="review-row"><span id="lblPts"></span><strong id="rPts"></strong></div>
        <div class="review-row"><span id="lblTime"></span><strong id="rTime"></strong></div>
      </div>
    </section>
  </div>

  <script src="/sdk/wajibet-sdk.js"></script>
  <script>
    WajibetSDK.onReviewData(function (it) {
      document.documentElement.dir = WajibetSDK.getDirection();
      document.getElementById('lblPts').textContent = WajibetSDK.t('score');
      document.getElementById('lblTime').textContent = WajibetSDK.t('time');

      var m = it.meta || {};
      document.getElementById('status').textContent =
        it.skipped ? WajibetSDK.t('timesUp') : (it.isCorrect ? WajibetSDK.t('correct') : WajibetSDK.t('wrong'));

      var box = document.getElementById('dropZones');
      var allCats = Array.isArray(m.allCategories) && m.allCategories.length ? m.allCategories : [it.correctAnswer];

      // Rebuild the trays for the teacher view
      allCats.forEach(function (name) {
        var z = document.createElement('div');
        z.className = 'drop-zone';
        z.style.cursor = 'default';
        z.style.minHeight = '90px';

        var slot = document.createElement('div');
        slot.className = 'slot-container';
        z.appendChild(slot);

        var title = document.createElement('div');
        title.className = 'drop-zone-title';
        title.textContent = name;
        z.appendChild(title);

        if (name === it.correctAnswer) {
          z.classList.add('is-correct');
          z.insertAdjacentHTML('afterbegin', '<span class="tag" style="margin-bottom: auto;">' + WajibetSDK.t('correct') + '</span>');
        }
        else if (name === m.chosenCategory) {
          z.classList.add('is-wrong');
          z.insertAdjacentHTML('afterbegin', '<span class="tag" style="margin-bottom: auto;">' + WajibetSDK.t('yourAnswer') + '</span>');
        }

        // Place the card where the student put it
        if (name === m.chosenCategory || (it.skipped && name === it.correctAnswer)) {
          var card = document.createElement('div');
          card.className = 'drag-card review-card-static';
          card.textContent = m.itemText || '';
          slot.appendChild(card);
        }
        // If they got it wrong, show a ghost card in the tray where it SHOULD have gone
        else if (name === it.correctAnswer && m.chosenCategory !== it.correctAnswer) {
          var ghost = document.createElement('div');
          ghost.className = 'drag-card review-card-static is-ghost';
          ghost.textContent = m.itemText || '';
          slot.appendChild(ghost);
        }

        box.appendChild(z);
      });

      var why = document.getElementById('why');
      why.textContent = m.explanation || '';
      if (!m.explanation) why.style.display = 'none';

      document.getElementById('rPts').textContent = (it.score || 0) + ' / ' + (it.maxScore || 0);
      document.getElementById('rTime').textContent = (((it.timeMs || 0) / 1000).toFixed(1)) + 's';
    });
  </script>
</body>

</html>
