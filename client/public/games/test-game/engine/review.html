<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matrix - Review</title>
  <link rel="stylesheet" href="style.css">
  <script src="/sdk/wajibet-sdk.js"></script>
  <style>
    body {
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
    }
    .review-container {
      width: 100%;
      max-width: 600px;
      background: var(--panel-bg);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .review-header {
      font-size: 1.5rem;
      margin-block-end: 24px;
      color: var(--text-main);
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-block-end: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.expected { background-color: var(--primary); }
    .dot.correct { background-color: var(--success); }
    .dot.wrong { background-color: var(--error); }
  </style>
</head>
<body>

  <div class="review-container">
    <div class="review-header" id="review-header">Loading replay...</div>
    
    <div class="legend" id="legend" style="display: none;">
      <div class="legend-item"><div class="dot expected"></div> Expected</div>
      <div class="legend-item"><div class="dot correct"></div> Student Hit</div>
      <div class="legend-item"><div class="dot wrong"></div> Student Miss</div>
    </div>

    <div class="grid" id="grid" style="display: none;">
      <button class="tile" data-index="0" disabled></button>
      <button class="tile" data-index="1" disabled></button>
      <button class="tile" data-index="2" disabled></button>
      <button class="tile" data-index="3" disabled></button>
      <button class="tile" data-index="4" disabled></button>
      <button class="tile" data-index="5" disabled></button>
      <button class="tile" data-index="6" disabled></button>
      <button class="tile" data-index="7" disabled></button>
      <button class="tile" data-index="8" disabled></button>
    </div>
  </div>

  <script>
    if (typeof WajibetSDK !== 'undefined') {
      WajibetSDK.onReviewData((meta) => {
        const header = document.getElementById('review-header');
        const grid = document.getElementById('grid');
        const legend = document.getElementById('legend');
        const tiles = document.querySelectorAll('.tile');
        
        // meta is the exact payload sent during recordInteraction()
        // Example: { isCorrect: false, userAnswer: "0,1,5", correctAnswer: "0,2,5", timeMs: 4500, score: 0 }
        
        if (!meta || !meta.correctAnswer) {
          header.textContent = "No replay data available.";
          return;
        }

        const isRtl = WajibetSDK.getDirection() === 'rtl';
        document.documentElement.dir = isRtl ? 'rtl' : 'ltr';

        header.textContent = meta.isCorrect ? "Student answered perfectly!" : "Student made a mistake.";
        header.style.color = meta.isCorrect ? "var(--success)" : "var(--error)";

        grid.style.display = 'grid';
        legend.style.display = 'flex';

        const expected = meta.correctAnswer.split(',').map(Number);
        const answered = (meta.userAnswer || "").split(',').map(Number).filter(n => !isNaN(n));

        // Render the exact sequence comparison
        tiles.forEach(tile => {
          const index = parseInt(tile.dataset.index, 10);
          
          if (answered.includes(index) && expected.includes(index)) {
            tile.classList.add('correct'); // Student hit correctly
          } else if (answered.includes(index) && !expected.includes(index)) {
            tile.classList.add('wrong'); // Student hit wrong tile
          } else if (!answered.includes(index) && expected.includes(index)) {
            tile.classList.add('highlight'); // Student missed this expected tile
          }
        });
      });
    } else {
      console.error("WajibetSDK missing");
    }
  </script>
</body>
</html>
