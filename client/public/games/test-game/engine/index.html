<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matrix (V2)</title>
  
  <!-- CSS Styles using Logical Properties -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Load the WajibetSDK from the Server -->
  <script src="/sdk/wajibet-sdk.js"></script>
</head>
<body>
  
  <!-- The Game Container -->
  <div class="game-container" id="game-container" style="display: none;">
    <div class="hud">
      <div class="level-indicator">Level <span id="level-display">1</span></div>
      <div class="score-indicator">Score: <span id="score-display">0</span></div>
    </div>
    
    <div class="instruction-text" id="instruction-text">
      Memorize the pattern...
    </div>

    <div class="grid" id="grid">
      <!-- 9 tiles -->
      <button class="tile" data-index="0"></button>
      <button class="tile" data-index="1"></button>
      <button class="tile" data-index="2"></button>
      <button class="tile" data-index="3"></button>
      <button class="tile" data-index="4"></button>
      <button class="tile" data-index="5"></button>
      <button class="tile" data-index="6"></button>
      <button class="tile" data-index="7"></button>
      <button class="tile" data-index="8"></button>
    </div>
    
    <div class="overlay" id="end-overlay" style="display: none;">
      <h2 id="end-title">Game Over!</h2>
      <p id="end-score"></p>
    </div>
  </div>

  <!-- Game Logic (Decoupled) -->
  <script src="game.js"></script>
</body>
</html>
